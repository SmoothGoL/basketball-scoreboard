<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="score-div">
                <h3>HOME</h3>
                <div class="scoreboard">
                    <h4 class="score" id="home-score">0</h4>
                </div>
                <div class="score-editors">
                    <button class="editor-btn buttons" onclick="addToHome(1)">+1</button>
                    <button class="editor-btn buttons" onclick="addToHome(2)">+2</button>
                    <button class="editor-btn buttons" onclick="addToHome(3)">+3</button>
                </div>
            </div>
            <div class="score-div">
                <h3>GUEST</h3>
                <div class="scoreboard">
                    <h4 class="score" id="guest-score">0</h4>
                </div>
                <div class="score-editors">
                    <button class="editor-btn buttons" onclick="addToGuest(1)">+1</button>
                    <button class="editor-btn buttons" onclick="addToGuest(2)">+2</button>
                    <button class="editor-btn buttons" onclick="addToGuest(3)">+3</button>
                </div>
            </div>
        </div>
        <button class="newgame-btn buttons" onclick="newGame()">New Game</button>
        <script src="index.js"></script>
    </body>
</html>
